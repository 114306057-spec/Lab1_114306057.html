<!DOCTYPE html>
<html>
<head>
    <title>Personal Information</title>
</head>
<body>

<h1>My Personal Information</h1>

<!-- Requirement #1 -->
<table border="1">
    <tr>
        <th colspan="3">Personal Information Table</th>
    </tr>
    <tr>
        <td rowspan="3" align="center">
            <img src="Personal_photo.png" alt="Personal Photo" width="120" height="120"><br>
            Personal Photo
        </td>
        <td>
            Name: <input type="text"><br><br>
            Gender:
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
            <input type="radio" name="gender" value="other"> Other
        </td>
        <td></td>
    </tr>
    <tr>
        <td>
            County:
            <select>
                <option>Taipei</option>
                <option>Tainan</option>
                <option>Taichung</option>
                <option>Taoyuan</option>
            </select>
        </td>
        <td>
            Birthday: <input type="date">
        </td>
    </tr>
    <tr>
        <td colspan="2">
            E-mail: <input type="email">
        </td>
    </tr>
</table>

<br>

<!-- Requirement #2 -->
<table border="1">
    <tr>
        <th colspan="2">More About Me</th>
    </tr>
    <tr>
        <td>Hobby</td>
        <td>
            <input type="checkbox"> Swimming
            <input type="checkbox"> Volleyball
            <input type="checkbox"> Movie
            <input type="checkbox"> Game
            <input type="checkbox"> Sleep
        </td>
    </tr>
    <tr>
        <td>Skill</td>
        <td>
            <input type="checkbox"> Java
            <input type="checkbox"> HTML
            <input type="checkbox"> Python
            <input type="checkbox"> Microsoft Office
            <input type="checkbox"> Premiere
        </td>
    </tr>
    <tr>
        <td>Say something</td>
        <td>
            <textarea rows="4" cols="40">Say something here.</textarea>
        </td>
    </tr>
</table>

</body>
</html>
